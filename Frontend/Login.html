<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Mente Activa Psicopedagogía</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap"
    rel="stylesheet">


  <link href="Css/Styles.css" rel="stylesheet">
</head>

<body>

  <!-- Razor: inicio de contenido de la vista -->
  <main class="PantallaLogin">
    <div class="TarjetaLogin">
      <a href="Index.html" class="TarjetaLogin-Marca">
        <img src="Img/LogoMenteActiva.jpeg" alt="Logo Mente Activa Psicopedagogía" class="LogoMarca">
        Mente Activa Psicopedagogía
      </a>

      <div class="btn-group w-100 mb-4" role="group" aria-label="Tipo de acceso" id="SelectorTipoAcceso">
        <button type="button" class="btn btn-outline-primary active" data-tipo-acceso="Admin">
          <i class="bi bi-briefcase me-1"></i>Personal administrativo
        </button>
        <button type="button" class="btn btn-outline-primary" data-tipo-acceso="Portal">
          <i class="bi bi-house-heart me-1"></i>Portal de familias
        </button>
      </div>

      <!-- Razor: asp-controller="Cuenta" asp-action="Login" method="post" -->
      <form id="FormularioLogin" novalidate>
        <input type="hidden" id="TipoAcceso" value="Admin">
        <div class="mb-3">
          <label for="CorreoElectronico" class="form-label CampoObligatorio">Correo electrónico</label>
          <input type="email" class="form-control" id="CorreoElectronico" name="CorreoElectronico"
            placeholder="correo@ejemplo.com" autocomplete="username">
          <div class="invalid-feedback"></div>
        </div>
        <div class="mb-2">
          <label for="Contrasena" class="form-label CampoObligatorio">Contraseña</label>
          <input type="password" class="form-control" id="Contrasena" name="Contrasena" placeholder="Su contraseña"
            autocomplete="current-password">
          <div class="invalid-feedback"></div>
        </div>
        <div class="text-end mb-4">
          <!-- Razor: asp-controller="Cuenta" asp-action="RecuperarContrasena" -->
          <a href="RecuperarContrasena.html" class="small">¿Olvidó su contraseña?</a>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg">
          <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
        </button>
      </form>

      <p class="text-center TextoSuave small mt-4 mb-0">
        <a href="Index.html"><i class="bi bi-arrow-left me-1"></i>Volver al sitio público</a>
      </p>
    </div>
  </main>
  <!-- Razor: /fin de contenido de la vista -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="Js/Main.js"></script>
  <script src="Js/Validaciones.js"></script>
</body>

</html>
